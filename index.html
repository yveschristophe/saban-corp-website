<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SABAN CORP, studio digital indépendant à Toulouse. Création et refonte de sites web, développement sur mesure et accompagnement digital pour les professionnels." />
    <title>SABAN CORP | Création de sites web &amp; solutions digitales à Toulouse</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify detects forms in the built HTML, before React renders. Keep field names in sync with App.tsx. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" required />
      <input name="company" />
      <input name="email" type="email" required />
      <input name="project" required />
      <textarea name="message" required></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
